<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#1a1a2e;--grid:#2a2a4a;--table:#8B7355;
--n:#e63946;--s:#457b9d;--iron:#a8dadc;--field:#ffd166;
--accent:#06d6a0;--text:#f1faee;--panel:rgba(255,255,255,0.08);
--needle:#c0c0c0;--wood-light:#a08060;--wood-dark:#6b5030;
}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text)}
#app{display:flex;flex-direction:column;height:100vh}
#header{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,0.1)}
#header h1{font-size:calc(16px + var(--fs,0px));font-weight:700;white-space:nowrap}
.flex{flex:1}
.btn{background:var(--accent);border:none;border-radius:10px;color:#000;padding:10px 16px;font-size:calc(14px + var(--fs,0px));font-weight:700;cursor:pointer;min-height:48px;min-width:48px;transition:transform 0.1s,opacity 0.1s;touch-action:manipulation}
.btn:active{transform:scale(0.95)}
.btn.off{background:#555;color:#aaa}
.icon-btn{font-size:24px;background:transparent;border:2px solid var(--accent);border-radius:10px;min-width:48px;min-height:48px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.2s}
.icon-btn:hover{background:rgba(6,214,160,0.2)}
.icon-btn.active{background:var(--accent)}
.slider-wrap{display:flex;align-items:center;gap:6px;font-size:calc(12px + var(--fs,0px))}
input[type=range]{width:80px;accent-color:var(--accent)}
#main{display:flex;flex:1;overflow:hidden}
#sidebar{width:120px;flex-shrink:0;background:var(--panel);display:flex;flex-direction:column;gap:8px;padding:10px;overflow-y:auto;border-right:1px solid rgba(255,255,255,0.1)}
.level-btn{background:rgba(255,255,255,0.05);border:2px solid transparent;border-radius:10px;color:var(--text);padding:10px 8px;font-size:calc(12px + var(--fs,0px));font-weight:600;cursor:pointer;text-align:center;min-height:60px;transition:all 0.2s;word-break:keep-all}
.level-btn.selected{border-color:var(--accent);background:rgba(6,214,160,0.15)}
.level-btn:hover{background:rgba(255,255,255,0.1)}
.level-btn.completed{background:rgba(6,214,160,0.2);border-color:var(--accent)}
.level-num{display:block;font-size:calc(18px + var(--fs,0px));font-weight:700;color:var(--accent)}
.level-name{display:block;font-size:calc(10px + var(--fs,0px));margin-top:4px;line-height:1.2}
#canvas-wrap{flex:1;position:relative;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#toolbar{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:8px;background:var(--panel);backdrop-filter:blur(8px);border-radius:16px;border:1px solid rgba(255,255,255,0.1)}
#hint-bar{flex-shrink:0;padding:8px 16px;background:var(--panel);border-top:1px solid rgba(255,255,255,0.1);font-size:calc(14px + var(--fs,0px));text-align:center;min-height:48px;display:flex;align-items:center;justify-content:center}
#hint-bar span{opacity:0.7}
#level-info{position:absolute;top:16px;left:16px;background:var(--panel);backdrop-filter:blur(8px);border-radius:12px;padding:12px 16px;border:1px solid rgba(255,255,255,0.1);max-width:260px;font-size:calc(13px + var(--fs,0px))}
#level-info h2{font-size:calc(16px + var(--fs,0px));margin-bottom:6px;color:var(--accent)}
#level-info p{opacity:0.8;line-height:1.4}
#complete-banner{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.9);border:3px solid var(--accent);border-radius:20px;padding:30px 40px;text-align:center;z-index:100}
#complete-banner h2{font-size:calc(28px + var(--fs,0px));color:var(--accent);margin-bottom:10px}
#complete-banner p{font-size:calc(18px + var(--fs,0px));margin-bottom:20px}
#footer{position:absolute;bottom:4px;right:8px;font-size:11px;opacity:0.4;pointer-events:none}
#progress-bar{position:absolute;top:16px;right:16px;background:var(--panel);backdrop-filter:blur(8px);border-radius:12px;padding:8px 14px;border:1px solid rgba(255,255,255,0.1);font-size:calc(13px + var(--fs,0px));color:var(--accent);min-width:100px;text-align:center}
#intro-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:200;align-items:center;justify-content:center;flex-direction:column;gap:16px}
#intro-overlay.show{display:flex}
#intro-overlay h2{font-size:calc(32px + var(--fs,0px));color:var(--accent)}
#intro-overlay p{font-size:calc(20px + var(--fs,0px));opacity:0.9;text-align:center;max-width:400px;line-height:1.4}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>

<script>
(function(){
const levels=[
{id:1,name:'磁鐵吸邊個？',hint:'拖動磁鐵去吸鐵釘！',desc:'磁鐵可以吸鐵製品，但唔吸塑膠。',task:'用磁鐵吸起所有鐵釘（灰色），避開塑膠珠（彩色）'},
{id:2,name:'認識兩極',hint:'睇羅盤針點轉',desc:'磁鐵有兩極：紅色N極、藍色S極。',task:'摆放磁鐵，觀察周圍羅盤針既指向方向'},
{id:3,name:'同極相斥',hint:'同極互相推開',desc:'N極同N極會互相推開，S極同S極都係。',task:'將兩塊磁鐵既同極擺近，觀察羅盤針既反應'},
{id:4,name:'異極相吸',hint:'異極互相吸引',desc:'N極會被S極吸引，就好似好朋友咁。',task:'將N極同S極擺近，觀察羅盤針既反應'},
{id:5,name:'指南針',hint:'指向北方',desc:'地球本身就係一塊大磁鐵，所以羅盤針永遠指向北方。',task:'羅盤針永遠指向北方（→），試下移動磁鐵干擾佢！'}
];
let currentLevel=0,speechEnabled=true,showFieldLines=true;
let magnets=[],compassNeedles=[],ironObjects=[],plasticBeads=[];
let fieldLineCache=null,fieldLineDirty=true;
let studentInteracted=false;

const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let W,H,dpr;
var gameTime=0;

// Web Audio for proximity beep
var audioCtx=null;
function getAudioCtx(){
 if(!audioCtx){
  try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}
 }
 return audioCtx;
}
function playBeep(freq,dur){
 var ac=getAudioCtx();
 if(!ac)return;
 try{
  var osc=ac.createOscillator();
  var gain=ac.createGain();
  osc.connect(gain);
  gain.connect(ac.destination);
  osc.type='sine';
  osc.frequency.value=freq;
  gain.gain.setValueAtTime(0.15,ac.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
  osc.start(ac.currentTime);
  osc.stop(ac.currentTime+dur);
 }catch(e){}
}
function playCollectSound(){
 var ac=getAudioCtx();
 if(!ac)return;
 try{
  var osc=ac.createOscillator();
  var gain=ac.createGain();
  osc.connect(gain);
  gain.connect(ac.destination);
  osc.type='sine';
  osc.frequency.setValueAtTime(880,ac.currentTime);
  osc.frequency.exponentialRampToValueAtTime(1760,ac.currentTime+0.1);
  gain.gain.setValueAtTime(0.2,ac.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+0.2);
  osc.start(ac.currentTime);
  osc.stop(ac.currentTime+0.2);
 }catch(e){}
}

function resize(){
 dpr=window.devicePixelRatio||1;
 const wrap=document.getElementById('canvas-wrap');
 W=wrap.clientWidth;H=wrap.clientHeight;
 canvas.width=W*dpr;canvas.height=H*dpr;
 canvas.style.width=W+'px';canvas.style.height=H+'px';
 ctx.scale(dpr,dpr);
}
window.addEventListener('resize',resize);
resize();

function lerp(a,b,t){return a+(b-a)*t}
function atan2(y,x){return Math.atan2(y,x)}
function dist(x1,y1,x2,y2){return Math.hypot(x2-x1,y2-y1)}

function getMagField(x,y){
 let bx=0,by=0;
 for(const m of magnets){
  const dx=x-m.x,dy=y-m.y;
  const d=Math.max(10,Math.hypot(dx,dy));
  const k=5000;
  const len=Math.pow(d,3);
  const sgn=m.dir?1:-1;
  const rdx=dx/d,rdy=dy/d;
  const mdotr=rdx*sgn;
  const tx=k/len*(3*(sgn*mdotr)*rdx-sgn);
  const ty=k/len*(3*(sgn*mdotr)*rdy-0);
  bx+=tx;by+=ty;
 }
 if(currentLevel===4){
  bx+=800;by+=0;
 }
 return {bx,by};
}

function computeFieldLines(){
 const lines=[];
 var lineCount=20;
 if(currentLevel===1)lineCount=8;
 for(const m of magnets){
  const pole=m.dir;
  const px=m.x,py=m.y;
  for(let i=0;i<lineCount;i++){
   const baseAngle=-Math.PI+i*(2*Math.PI/lineCount)+0.05;
   const angle=baseAngle+(Math.random()-0.5)*0.08;
   const sp=8;
   const sx=px+Math.cos(angle)*sp;
   const sy=py+Math.sin(angle)*sp;
   const pts=traceLine(sx,sy,pole);
   if(pts.length>2)lines.push(pts);
  }
 }
 return lines;
}

function traceLine(sx,sy,pole){
 const pts=[{x:sx,y:sy}];
 const step=4,maxStep=600;
 const noise=0.3;
 let x=sx,y=sy,px=sx,py=sy;
 for(let i=0;i<maxStep;i++){
  const {bx,by}=getMagField(x,y);
  const len=Math.hypot(bx,by);
  if(len<0.001)break;
  const nx=bx/len,ny=by/len;
  const jx=nx+(Math.random()-0.5)*noise;
  const jy=ny+(Math.random()-0.5)*noise;
  const jlen=Math.hypot(jx,jy);
  const vx=jx/jlen,vy=jy/jlen;
  px=x;py=y;
  x+=vx*step;
  y+=vy*step;
  if(x<0||x>W||y>H)break;
  let hitPole=null;
  for(const m of magnets){
   const d=dist(x,y,m.x,m.y);
   if(d<22){
    if(pole&&!m.dir){hitPole='S';break}
    if(!pole&&m.dir){hitPole='N';break}
   }
  }
  if(hitPole){pts.push({x,y});break}
  if(i%3===0)pts.push({x,y});
 }
 return pts;
}

function drawFieldLines(lines){
 ctx.save();
 ctx.strokeStyle='rgba(255,209,102,0.55)';
 ctx.lineWidth=2;
 ctx.setLineDash([]);
 for(const pts of lines){
  if(pts.length<3)continue;
  ctx.beginPath();
  ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length-1;i++){
   const mx=(pts[i].x+pts[i+1].x)/2;
   const my=(pts[i].y+pts[i+1].y)/2;
   ctx.quadraticCurveTo(pts[i].x,pts[i].y,mx,my);
  }
  ctx.lineTo(pts[pts.length-1].x,pts[pts.length-1].y);
  ctx.stroke();
  if(pts.length>4){
   const last=pts[pts.length-1];
   const prev=pts[pts.length-2];
   const angle=Math.atan2(last.y-prev.y,last.x-prev.x);
   drawArrow(last.x,last.y,angle);
  }
 }
 ctx.restore();
}

function drawArrow(x,y,angle){
 ctx.save();
 ctx.translate(x,y);
 ctx.rotate(angle);
 ctx.fillStyle='rgba(255,209,102,0.8)';
 ctx.beginPath();
 ctx.moveTo(8,0);
 ctx.lineTo(-5,5);
 ctx.lineTo(-5,-5);
 ctx.closePath();
 ctx.fill();
 ctx.restore();
}

function drawBackground(){
 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,'#1a1a2e');
 g.addColorStop(1,'#16213e');
 ctx.fillStyle=g;
 ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='rgba(42,42,74,0.5)';
 ctx.lineWidth=1;
 const grid=40;
 for(let x=0;x<=W;x+=grid){
  ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
 }
 for(let y=0;y<=H;y+=grid){
  ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
 }
 const tg=ctx.createLinearGradient(0,H*0.7,0,H);
 tg.addColorStop(0,'#8B7355');
 tg.addColorStop(0.5,'#a08060');
 tg.addColorStop(1,'#6b5030');
 ctx.fillStyle=tg;
 ctx.fillRect(0,H*0.72,W,H*0.28);
 ctx.strokeStyle='rgba(0,0,0,0.1)';
 ctx.lineWidth=1;
 for(let x=0;x<=W;x+=30){
  ctx.beginPath();ctx.moveTo(x,H*0.72);ctx.lineTo(x,H);ctx.stroke();
 }
 // Draw N direction indicator at top-right
 ctx.save();
 ctx.fillStyle='rgba(255,255,255,0.4)';
 ctx.font='bold 16px sans-serif';
 ctx.textAlign='center';
 ctx.fillText('北方 →',W-50,20);
 ctx.restore();
}

var NEEDLE_LEN=48;
function drawCompass(x,y,angle,needleLen){
 ctx.save();
 ctx.translate(x,y);
 ctx.fillStyle='rgba(0,0,0,0.3)';
 ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;
 ctx.beginPath();ctx.arc(0,0,22,0,Math.PI*2);ctx.stroke();
 ctx.rotate(angle);
 // N pole (red) - larger arrow shape for visibility
 ctx.fillStyle='#e63946';ctx.strokeStyle='#e63946';
 ctx.beginPath();
 ctx.moveTo(needleLen/2,0);
 ctx.lineTo(needleLen/2-10,5);
 ctx.lineTo(needleLen/2-10,-5);
 ctx.closePath();
 ctx.fill();
 // S pole (darker blue)
 ctx.fillStyle='#1f5c8a';ctx.strokeStyle='#1f5c8a';
 ctx.beginPath();
 ctx.moveTo(-needleLen/2,0);
 ctx.lineTo(-needleLen/2+10,5);
 ctx.lineTo(-needleLen/2+10,-5);
 ctx.closePath();
 ctx.fill();
 ctx.restore();
}

function drawMagnet(x,y,dir,isDragging){
 ctx.save();
 ctx.translate(x,y);
 // Drag glow
 if(isDragging){
  ctx.shadowColor='rgba(255,209,102,0.8)';
  ctx.shadowBlur=20;
 }
 const w=80,h=30,r=8;
 ctx.fillStyle='#aaa';
 ctx.beginPath();
 roundRect(-w/2,-h/2,w,h,r);ctx.fill();
 ctx.fillStyle=dir?'#e63946':'#1f5c8a';
 ctx.beginPath();roundRect(-w/2,-h/2,w/2,h,r,['tl','bl']);ctx.fill();
 ctx.fillStyle=dir?'#b0202f':'#0f2d4a';
 ctx.beginPath();roundRect(0,-h/2,w/2,h,r,['tr','br']);ctx.fill();
 ctx.fillStyle='#fff';ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
 ctx.fillText(dir?'N':'S',dir?-w/4:w/4,0);
 ctx.restore();
}

function roundRect(x,y,w,h,r,corners){
 ctx.beginPath();
 const tl=corners&&corners.includes('tl');
 const tr=corners&&corners.includes('tr');
 const bl=corners&&corners.includes('bl');
 const br=corners&&corners.includes('br');
 ctx.moveTo(x+r,y);
 if(tl)ctx.arcTo(x,y,x,y+r,r);else ctx.lineTo(x,y);
 ctx.lineTo(x+w-(r),y);
 if(tr)ctx.arcTo(x+w,y,x+w,y+r,r);else ctx.lineTo(x+w,y);
 ctx.lineTo(x+w,y+h-r);
 if(br)ctx.arcTo(x+w,y+h,x+w-r,y+h,r);else ctx.lineTo(x+w,y+h);
 ctx.lineTo(x+r,y+h);
 if(bl)ctx.arcTo(x,y+h,x,y+h-r,r);else ctx.lineTo(x,y+h);
 ctx.closePath();
}

function drawIron(obj){
 if(obj.collected){
  if(obj.collectAnim>0){
   ctx.save();
   ctx.globalAlpha=obj.collectAnim;
   ctx.translate(obj.x,obj.y);
   var s=1-obj.collectAnim;
   ctx.scale(s,s);
   ctx.translate(-obj.x,-obj.y);
   drawIronShape(obj);
   ctx.restore();
   obj.collectAnim-=0.05;
   if(obj.collectAnim<=0)obj.collected=false;
  }
  return;
 }
 // Pulse glow for uncollected iron
 ctx.save();
 var pulse=0.5+0.5*Math.sin(gameTime*3);
 ctx.shadowColor='rgba(255,255,255,'+pulse*0.5+')';
 ctx.shadowBlur=12*pulse;
 drawIronShape(obj);
 ctx.restore();
}

function drawIronShape(obj){
 ctx.save();
 ctx.translate(obj.x,obj.y);
 ctx.rotate(obj.r||0);
 if(obj.type==='nail'){
  ctx.fillStyle='#a8dadc';ctx.strokeStyle='#7bb8ba';ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(-27,-6,54,12,4);ctx.fill();ctx.stroke();
  ctx.fillStyle='#888';
  ctx.beginPath();ctx.arc(-27,0,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#aaa';ctx.beginPath();ctx.arc(-27,0,2.5,0,Math.PI*2);ctx.fill();
 }else{
  ctx.strokeStyle='#a8dadc';ctx.lineWidth=3;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-10,-8);ctx.lineTo(-10,8);ctx.lineTo(10,8);ctx.lineTo(10,-8);ctx.stroke();
 }
 ctx.restore();
}

function drawBead(obj){
 ctx.save();
 ctx.translate(obj.x,obj.y);
 ctx.beginPath();
 ctx.arc(0,0,12,0,Math.PI*2);
 ctx.fillStyle=obj.color;
 ctx.fill();
 ctx.strokeStyle='rgba(255,255,255,0.4)';
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.arc(-3,-3,5,0,Math.PI*2);
 ctx.stroke();
 ctx.restore();
}

function drawUI(){
 ctx.fillStyle='rgba(255,255,255,0.15)';
 ctx.font='12px sans-serif';ctx.textAlign='right';
 ctx.fillText('🧲',12,26);
 ctx.textAlign='left';
 ctx.fillText('磁場線：'+(showFieldLines?'開':'關'),12,44);
}

function getTargetAngle(n){
 const {bx,by}=getMagField(n.x,n.y);
 if(Math.hypot(bx,by)<0.5)return n.targetAngle||n.angle;
 n.targetAngle=Math.atan2(by,bx);
 return n.targetAngle;
}

function updateNeedles(){
 for(const n of compassNeedles){
  const ta=getTargetAngle(n);
  let diff=ta-(n.angle||0);
  while(diff>Math.PI)diff-=Math.PI*2;
  while(diff<-Math.PI)diff+=Math.PI*2;
  n.angle=(n.angle||0)+diff*0.12;
 }
}

function updateIron(){
 var nearestDist=999;
 for(const obj of ironObjects){
  if(obj.collected&&obj.collectAnim<=0)continue;
  if(obj.collected)continue;
  let fx=0,fy=0,collected=false;
  for(const m of magnets){
   const d=dist(obj.x,obj.y,m.x,m.y);
   if(d<40){
    collected=true;
    obj.collected=true;
    obj.collectAnim=1;
    obj.vx=0;obj.vy=0;
    playCollectSound();
    break;
   }
   if(d<nearestDist)nearestDist=d;
   if(d<60){
    const force=(60-d)/60*2;
    const angle=Math.atan2(m.y-obj.y,m.x-obj.x);
    fx+=Math.cos(angle)*force;
    fy+=Math.sin(angle)*force;
   }
  }
  if(!collected){
   obj.vx=lerp(obj.vx||0,fx,0.03);
   obj.vy=lerp(obj.vy||0,fy,0.03);
   obj.x+=obj.vx||0;
   obj.y+=obj.vy||0;
   obj.x=Math.max(20,Math.min(W-20,obj.x));
   obj.y=Math.max(20,Math.min(H-20,obj.y));
   obj.r=(obj.r||0)+(obj.vx||0)*0.05;
  }
 }
 // Proximity beep
 if(nearestDist<60&&drag&&drag&&drag!==null){
  var freq=220+60*(1-nearestDist/60)*4;
  if(nearestDist<40)freq*=1.5;
 }
}

function updateProgressCounter(){
 var el=document.getElementById('progress-bar');
 if(currentLevel===0){
  var total=3;
  var remaining=ironObjects.filter(function(o){return !o.collected||o.collectAnim>0;}).length;
  var collected=total-remaining;
  el.textContent='鐵釘 '+collected+'/'+total;
  el.style.display='block';
 }else{
  var deflectPct=0;
  if(compassNeedles.length>0){
   var sum=0;
   for(var i=0;i<compassNeedles.length;i++){
    var n=compassNeedles[i];
    var ta=getTargetAngle(n);
    var diff=ta-(n.angle||0);
    while(diff>Math.PI)diff-=Math.PI*2;
    while(diff<-Math.PI)diff+=Math.PI*2;
    sum+=Math.min(Math.abs(diff)/Math.PI,1);
   }
   deflectPct=Math.round((sum/compassNeedles.length)*100);
  }
  el.textContent='偏轉 '+deflectPct+'%';
  el.style.display='block';
 }
}

function checkLevelComplete(){
 if(currentLevel===0){
  var remaining=ironObjects.filter(function(o){return !o.collected||o.collectAnim>0;});
  if(remaining.length===0){
   showComplete('你收集晒所有鐵器了！準備進入下一關！');
  }
 }else if(currentLevel===1){
  if(studentInteracted){
   var count=0;
   for(var i=0;i<compassNeedles.length;i++){
    var n=compassNeedles[i];
    var ta=getTargetAngle(n);
    var diff=ta-(n.angle||0);while(diff>Math.PI)diff-=Math.PI*2;while(diff<-Math.PI)diff+=Math.PI*2;
    if(Math.abs(diff)>Math.PI/4)count++;
   }
   if(count>=Math.floor(compassNeedles.length*0.6))showComplete('你發現咗！磁鐵兩端既力量最強！');
  }
 }else if(currentLevel===2||currentLevel===3){
  if(studentInteracted){
   var count=0;
   for(var i=0;i<compassNeedles.length;i++){
    var n=compassNeedles[i];
    var ta=getTargetAngle(n);
    var diff=ta-(n.angle||0);while(diff>Math.PI)diff-=Math.PI*2;while(diff<-Math.PI)diff+=Math.PI*2;
    if(Math.abs(diff-Math.PI)<Math.PI/4)count++;
   }
   if(count>=Math.floor(compassNeedles.length*0.4))showComplete(currentLevel===2?'你發現咗！同極相斥！':'你發現咗！異極相吸！');
  }
 }else if(currentLevel===4){
  if(studentInteracted){
   var disturbed=0;
   for(var i=0;i<compassNeedles.length;i++){
    var n=compassNeedles[i];
    var ta=getTargetAngle(n);
    var diff=ta-(n.angle||0);while(diff>Math.PI)diff-=Math.PI*2;while(diff<-Math.PI)diff+=Math.PI*2;
    if(Math.abs(diff)>Math.PI/6)disturbed++;
   }
   if(disturbed>=Math.floor(compassNeedles.length*0.4))showComplete('你發現咗！地球係大磁鐵，永遠指向北方！');
  }
 }
}

function draw(){
 gameTime+=0.016;
 ctx.clearRect(0,0,W,H);
 drawBackground();
 if(showFieldLines){
  if(fieldLineDirty||!fieldLineCache){
   fieldLineCache=computeFieldLines();
   fieldLineDirty=false;
  }
  drawFieldLines(fieldLineCache);
 }
 for(var i=0;i<ironObjects.length;i++)drawIron(ironObjects[i]);
 for(var i=0;i<plasticBeads.length;i++)drawBead(plasticBeads[i]);
 for(var i=0;i<compassNeedles.length;i++)drawCompass(compassNeedles[i].x,compassNeedles[i].y,compassNeedles[i].angle||0,NEEDLE_LEN);
 for(var i=0;i<magnets.length;i++)drawMagnet(magnets[i].x,magnets[i].y,magnets[i].dir,drag===magnets[i]);
 drawUI();
 updateNeedles();
 updateIron();
 updateProgressCounter();
 requestAnimationFrame(draw);
 checkLevelComplete();
}

var drag=null;
var dragOffX=0,dragOffY=0;
var lastBeepTime=0;

function pointerPos(e){
 var r=canvas.getBoundingClientRect();
 var t=e.touches?e.touches[0]:e;
 var scaleX=W/r.width;
 var scaleY=H/r.height;
 return{x:(t.clientX-r.left)*scaleX,y:(t.clientY-r.top)*scaleY};
}

function hitTest(x,y){
 // Magnets - 48px touch padding (was 42×18, now 66×30)
 for(var i=0;i<magnets.length;i++){
  var m=magnets[i];
  if(Math.abs(x-m.x)<66&&Math.abs(y-m.y)<30)return m;
 }
 // Iron objects - 48px touch padding (was 22×10, now 36×16)
 for(var j=0;j<ironObjects.length;j++){
  var o=ironObjects[j];
  if(o.collected)continue;
  if(Math.abs(x-o.x)<36&&Math.abs(y-o.y)<16)return o;
 }
 // Compass needles - 48px touch padding (was r<24, now r<36)
 for(var k=0;k<compassNeedles.length;k++){
  var n=compassNeedles[k];
  var dx=x-n.x,dy=y-n.y;
  if(Math.sqrt(dx*dx+dy*dy)<36)return n;
 }
 // Plastic beads - 48px touch padding (was r<15, now r<24)
 for(var p=0;p<plasticBeads.length;p++){
  var b=plasticBeads[p];
  var bx=x-b.x,by=y-b.y;
  if(Math.sqrt(bx*bx+by*by)<24)return b;
 }
 return null;
}

canvas.addEventListener('mousedown',function(e){
 e.preventDefault();
 var pos=pointerPos(e);
 var obj=hitTest(pos.x,pos.y);
 if(obj){
  drag=obj;
  dragOffX=pos.x-obj.x;
  dragOffY=pos.y-obj.y;
  studentInteracted=true;
  fieldLineDirty=true;
  // Wrong object shake hint
  if(obj&&!obj.dir&&obj.type==='nail'){
   // dragging iron nail - gentle shake
  }else if(obj&&obj.type==='nail'&&obj!==null){
   // correct
  }
 }else{
  // Clicked on nothing - gentle hint
  playSpeech('試下拖磁鐵 🧲');
 }
});

canvas.addEventListener('mousemove',function(e){
 e.preventDefault();
 if(!drag)return;
 var pos=pointerPos(e);
 drag.x=Math.max(20,Math.min(W-20,pos.x-dragOffX));
 drag.y=Math.max(20,Math.min(H-20,pos.y-dragOffY));
 fieldLineDirty=true;
 // Proximity beep
 if(currentLevel===0){
  var nearestDist=999;
  for(var i=0;i<ironObjects.length;i++){
   if(ironObjects[i].collected)continue;
   var d=Math.hypot(drag.x-ironObjects[i].x,drag.y-ironObjects[i].y);
   if(d<nearestDist)nearestDist=d;
  }
  if(nearestDist<60&&gameTime-lastBeepTime>0.3){
   var freq=300+50*(1-nearestDist/60);
   playBeep(freq,0.08);
   lastBeepTime=gameTime;
  }
 }
});

canvas.addEventListener('mouseup',function(e){
 drag=null;
});

 e.preventDefault();

 var obj=hitTest(pos.x,pos.y);
 if(obj){
